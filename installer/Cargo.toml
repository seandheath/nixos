[package]
name = "installer"
version = "0.1.0"
edition = "2021"
description = "TUI installer for this NixOS fleet"

[[bin]]
name = "installer"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
